openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discord
    description: Discord community operations
  - name: site-content
    description: New Models site content
paths:
  /new-models/content:
    get:
      operationId: getNewModelsContent
      tags: [site-content]
      summary: Fetch New Models page and archive content
      responses:
        "200":
          description: New Models page and archive content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewModelsContent"
        "503":
          description: New Models content is unavailable
  /discord/{channelId}:
    get:
      operationId: getDiscordMessages
      tags: [discord]
      summary: Fetch messages from a public community channel
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discord messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscordMessage"
        "503":
          description: Discord is not configured
  /discord:
    post:
      operationId: postDiscordMessage
      tags: [discord]
      summary: Submit a message to the community webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordMessageInput"
      responses:
        "200":
          description: Message submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordSubmission"
        "503":
          description: Discord is not configured
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DiscordMessage:
      type: object
      additionalProperties: true
      required: [id, content]
      properties:
        id:
          type: string
        content:
          type: string
    DiscordMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
    DiscordSubmission:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NewModelsContent:
      type: object
      required: [featured, about, links, footer, columnA, columnB, columnC, search]
      properties:
        featured:
          type: object
          additionalProperties: true
        about:
          type: array
          items:
            type: object
            additionalProperties: true
        links:
          type: string
        footer:
          type: string
        columnA:
          type: array
          items:
            type: object
            additionalProperties: true
        columnB:
          type: array
          items:
            type: object
            additionalProperties: true
        columnC:
          type: array
          items:
            type: object
            additionalProperties: true
        search:
          type: object
          required: [nav, archive]
          properties:
            nav:
              type: object
              additionalProperties: true
            archive:
              type: array
              items:
                type: object
                required: [id, title, published, link, type, tags]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  published:
                    type: string
                  link:
                    type: string
                  type:
                    type: string
                  tags:
                    type: string
                  slug:
                    type: string
                additionalProperties: true
          additionalProperties: true
      additionalProperties: true
